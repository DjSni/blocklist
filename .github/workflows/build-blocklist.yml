name: Build Technitium Blocklist

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # UTC. Avoid minute 0 because scheduled workflows can be delayed at high-load times.
    - cron: "13 */6 * * *"

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: technitium-blocklist-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Restore HTTP cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/http
          key: blocklist-http-cache-${{ github.run_id }}
          restore-keys: |
            blocklist-http-cache-

      - name: Merge blocklists
        env:
          OUTPUT_DIR: public
          MAX_WORKERS: "24"
          FETCH_TIMEOUT_SECONDS: "25"
          MINIMIZE_COVERED_DOMAINS: "true"
        run: python scripts/merge_blocklists.py

      - name: Save HTTP cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/http
          key: blocklist-http-cache-${{ github.run_id }}

      - name: Show generated size
        run: |
          ls -lh public/technitium-blocklist.txt public/metadata.json
          python - <<'PY'
          import json
          data = json.load(open('public/metadata.json', encoding='utf-8'))
          print('entries:', data['final_block_entries'])
          print('size_mb:', round(data['output_size_bytes'] / 1024 / 1024, 2))
          print('sha256:', data['output_sha256'])
          PY

      - name: Publish as latest GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Latest Technitium blocklist" \
              --notes "Automatically generated Technitium DNS blocklist."
          fi

          gh release upload latest \
            public/technitium-blocklist.txt \
            public/metadata.json \
            --clobber
