name: Build Technitium Blocklist

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC. Avoid minute 0 because scheduled workflows can be delayed or dropped at high-load times.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: technitium-blocklist-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge blocklists
        run: python scripts/merge_blocklists.py

      - name: Commit generated files
        run: |
          if git diff --quiet -- dist/technitium-blocklist.txt dist/metadata.json; then
            echo "No blocklist changes. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/technitium-blocklist.txt dist/metadata.json
          git commit -m "Update Technitium blocklist"
          git pull --rebase
          git push
